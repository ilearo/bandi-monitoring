name: Monitora Bandi

on:
  schedule:
    - cron: '0 7 * * *'  # Ogni giorno alle 7 AM (CET)
  workflow_dispatch:  # Puoi eseguire manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Esegui scraper
        run: python scraper.py
      
      - name: Commit e push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bandi.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Aggiornamento bandi - $(date)" && git push)